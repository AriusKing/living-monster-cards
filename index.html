<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<title>Living Monster Cards</title>
<style>
:root{--bg:#0b0d10;--card:#151a21;--line:#26303a;--fg:#e9edf1;--dim:#8d97a3;--accent:#e8a94a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;
  padding:0 0 env(safe-area-inset-bottom)}
header{padding:26px 18px 14px;background:
  radial-gradient(120% 100% at 12% 0%,rgba(232,169,74,.16),transparent 62%),var(--bg);
  border-bottom:1px solid var(--line)}
h1{margin:0;font-size:27px;letter-spacing:-.02em;font-weight:700}
h1 .zh{display:block;font-size:17px;font-weight:500;color:var(--accent);letter-spacing:.14em;
  margin-top:7px;opacity:.95}
.sub{margin:11px 0 0;color:var(--dim);font-size:13.5px}
.sub b{color:var(--fg);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:13px 18px;border-bottom:1px solid var(--line);
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#141a21;color:#b9c3cd;border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font:inherit;font-size:13px;white-space:nowrap}
.chip i{font-style:normal;opacity:.55;font-size:11.5px;margin-left:3px}
.chip.on{background:rgba(232,169,74,.16);border-color:rgba(232,169,74,.55);color:#f2c98a}
main{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px}
@media(min-width:620px){main{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){main{grid-template-columns:repeat(4,1fr)}}
figure.c{position:relative;margin:0;border-radius:12px;overflow:hidden;background:var(--card);
  border:1px solid var(--line);transition:border-color .18s,transform .18s}
figure.c.playing{border-color:var(--accent);box-shadow:0 0 0 1px rgba(232,169,74,.35)}
video{display:block;width:100%;aspect-ratio:880/620;object-fit:cover;background:#0e1216}
.badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-58%);
  width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(10,12,15,.62);color:#fff;font-size:15px;padding-left:3px;
  border:1px solid rgba(255,255,255,.28);transition:opacity .18s}
figure.c.playing .badge{opacity:0}
figcaption{padding:9px 11px 11px}
figcaption b{display:block;font-size:13.5px;font-weight:600;line-height:1.3}
figcaption .zh{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
figcaption em{display:block;font-style:normal;font-size:10px;color:#5f6974;
  text-transform:uppercase;letter-spacing:.1em;margin-top:5px}
footer{padding:26px 18px 40px;color:#5f6974;font-size:11.5px;text-align:center;line-height:1.7}
</style>
</head>

<script>
(function(){

  function stopAll(except){
    cards.forEach(function(c){
      if(c===except) return;
      var v=c.querySelector('video');
      if(!v.paused){ v.pause(); c.classList.remove('playing'); }
    });

  g.addEventListener('click',function(e){
    var c=e.target.closest('figure.c'); if(!c) return;
    var v=c.querySelector('video');
    if(v.paused){
      stopAll(c);
      var pr=v.play();
      if(pr&&pr.catch) pr.catch(function(){});
      c.classList.add('playing');
    } else {
      v.pause(); c.classList.remove('playing');
    }
  });
  // family filter
  var chips=[].slice.call(document.querySelectorAll('.chip'));
  chips.forEach(function(ch){
    ch.addEventListener('click',function(){
      chips.forEach(function(o){o.classList.remove('on')});
      ch.classList.add('on');
      var f=ch.getAttribute('data-f');

      cards.forEach(function(c){

        c.style.display=hit?'':'none';
        if(!hit){var v=c.querySelector('video'); if(!v.paused)v.pause(); c.classList.remove('playing');}
      });

    });
  });

  if('IntersectionObserver' in window){

    },{rootMargin:'200px'});
    cards.forEach(function(c){io.observe(c)});
